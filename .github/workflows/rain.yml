name: Daily rainfall (IMERG)

# Pulls the last few days of NASA GPM IMERG Late daily precipitation,
# summarises it per district, commits data/processed/rain.json.
# Needs repo secret EARTHDATA_TOKEN (https://urs.earthdata.nasa.gov/profile ->
# Generate Token) AND a one-time click accepting the
# "NASA GESDISC DATA ARCHIVE" EULA on that same profile page.

on:
  schedule:
    - cron: "40 7 * * *"      # 07:40 UTC daily — IMERG Late lands ~12-18h after midnight UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rain
  cancel-in-progress: false

jobs:
  rain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests numpy geopandas shapely xarray h5netcdf h5py

      - name: Fetch rainfall
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/fetch_rain.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/processed/rain.json; then
            echo "no change"; exit 0
          fi
          git config user.name  "rain-bot"
          git config user.email "rain-bot@users.noreply.github.com"
          git add data/processed/rain.json
          git commit -m "rain: $(date -u +%F)"
          git push
