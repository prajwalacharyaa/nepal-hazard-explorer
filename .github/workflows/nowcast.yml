name: Daily landslide nowcast

# Pulls the latest NASA LHASA nowcast, summarises it per district, commits
# data/processed/nowcast.json. Needs repo secret EARTHDATA_TOKEN
# (https://urs.earthdata.nasa.gov/profile -> Generate Token).

on:
  schedule:
    - cron: "30 6 * * *"      # 06:30 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nowcast
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests numpy geopandas rasterio rasterstats shapely

      - name: Fetch nowcast
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python pipeline/fetch_nowcast.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/processed/nowcast.json; then
            echo "no change"; exit 0
          fi
          git config user.name  "nowcast-bot"
          git config user.email "nowcast-bot@users.noreply.github.com"
          git add data/processed/nowcast.json
          git commit -m "nowcast: $(date -u +%F)"
          git push
