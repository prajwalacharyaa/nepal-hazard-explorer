<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Event record — Nepal hazards</title>
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="doc">
  <header class="doc-head">
    <a href="index.html" class="back">← Map</a>
    <h1 id="e-title">Event</h1>
    <p id="e-sub" class="sub"></p>
  </header>

  <main class="doc-body narrow">
    <section class="split">
      <div id="e-map" class="mini-map" role="img" aria-label="Event location map"></div>
      <dl id="e-facts" class="facts"></dl>
    </section>

    <a id="e-impact" class="impact-cta" hidden href="#" target="_blank" rel="noopener">
      <span class="ic-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17c3-6 6 3 9-3s6 2 9-4"/><circle cx="3" cy="17" r="1.6"/>
        </svg>
      </span>
      <span class="ic-txt">
        <b>Open the full view</b>
        <span id="e-impact-sub"></span>
      </span>
      <span class="ic-go" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6M21 3l-8 8M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
        </svg>
      </span>
    </a>

    <section>
      <h2>Citation</h2>
      <pre id="e-cite" class="cite"></pre>
      <button id="dl-rec" class="secondary">⬇ Download this record (GeoJSON)</button>
      <a id="e-district-link" class="secondary" href="#">All events in this district →</a>
    </section>

    <nav class="prevnext"><a id="e-prev" href="#">← earlier</a><a id="e-next" href="#">later →</a></nav>
    <p class="src" id="e-src"></p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
  <script src="common.js"></script>
  <script src="event.js"></script>
</body>
</html>
